name: Deploy

# Deploy only code that passed CI: this runs after the CI workflow finishes
# successfully on main (or by hand).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job mint a GitHub OIDC token for Workload Identity Federation

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Repository *variables* (Settings > Secrets and variables > Actions > Variables).
      # None of these are secret; the GitHub token lives only in Secret Manager.
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/plumbline/plumbline:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          PLUMBLINE_GITHUB_ORG: ${{ vars.PLUMBLINE_GITHUB_ORG }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_REGION WIF_PROVIDER DEPLOYER_SA RUNTIME_SA PLUMBLINE_GITHUB_ORG; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository variable ${name}. Complete docs/deploy.md before deploying."
              missing=1
            fi
          done
          exit "$missing"

      # Workload Identity Federation: GitHub's OIDC token is exchanged for a
      # short-lived Google token. No long-lived JSON key exists anywhere.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      # --no-cpu-throttling: scans run AFTER the HTTP response; with request-based
      #   billing Cloud Run would throttle the CPU and background scans would stall.
      # --max-instances=1: the queue and SQLite live inside the instance.
      # --min-instances=0: scale to zero when idle (cost).
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy plumbline \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "${{ vars.RUNTIME_SA }}" \
            --no-cpu-throttling \
            --max-instances=1 \
            --min-instances=0 \
            --memory=256Mi \
            --cpu=1 \
            --port=8080 \
            --set-secrets=GITHUB_TOKEN=plumbline-github-token:latest \
            --set-env-vars=GITHUB_ORG=${{ vars.PLUMBLINE_GITHUB_ORG }},TRUSTED_PROXY_HOPS=1 \
            --quiet
