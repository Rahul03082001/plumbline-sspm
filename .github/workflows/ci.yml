name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: vet, staticcheck, race tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved; SHAs can't).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: Count tests (top-level and subtests)
        run: |
          go test -count=1 -v ./... > test.log
          echo "Top-level tests: $(grep -cE '^=== RUN   Test[^/]*$' test.log)"
          echo "All test cases:  $(grep -c '^=== RUN' test.log)"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t plumbline:ci .
      - name: Image size
        run: docker image ls plumbline:ci --format '{{.Size}}'
